[project]
name = "markitdown-diff-mcp"
version = "0.1.0"
description = "Local MCP server for comparing Markdown, text, and converted documents (DOCX, PDF, PPTX, XLSX, EPUB) — JSON, unified, and Markdown diff outputs"
authors = [{ name = "Justin Ritchie" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "mcp", "model-context-protocol", "markdown", "docx", "pdf",
    "diff", "compare", "markitdown", "docling", "pandoc",
    "claude", "claude-desktop", "claude-code", "ai-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastmcp>=2.5.0",
    "markitdown[all]>=0.0.1a4",
]

[project.optional-dependencies]
docling = ["docling>=2.0.0"]
pandoc = ["pypandoc>=1.13"]
all = ["docling>=2.0.0", "pypandoc>=1.13"]

[project.scripts]
markitdown-diff-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/justinritchie/markitdown-diff-mcp"
Repository = "https://github.com/justinritchie/markitdown-diff-mcp"
Issues = "https://github.com/justinritchie/markitdown-diff-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["server.py"]
